name: Waka Readme

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the waka section
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
        run: python3 scripts/update_waka.py

      - name: Commit and push
        run: |
          git config user.name "huanxin886"
          git config user.email "arknightsbo996@gmail.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README unchanged"
            exit 0
          fi
          git commit -m "更新自述文件"
          git push
